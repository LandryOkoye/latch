[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latch-reviewer"
version = "0.1.0"
description = "Latch reviewer UI: Streamlit app reading the shared ledger. Never imports the agent runtime."
requires-python = ">=3.10"
dependencies = [
    "latch-core",
    "streamlit",
    "pandas",
]

[tool.setuptools.packages.find]
where = ["src"]
