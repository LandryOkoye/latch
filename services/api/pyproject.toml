[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latch-api"
version = "0.1.0"
description = "Latch API: FastAPI backend exposing the ledger and agents to the React web UI."
requires-python = ">=3.10"
dependencies = [
    "latch-core",
    "latch-agent",
    "fastapi",
    "uvicorn[standard]",
]

[tool.setuptools.packages.find]
where = ["src"]
